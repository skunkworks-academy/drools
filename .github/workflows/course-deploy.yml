name: Deploy Drools course

on:
  workflow_dispatch:
  push:
    tags:
      - 'course-v*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: drools-course-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: course-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run validate:content
      - run: npm run build
      - uses: actions/configure-pages@v5
      - name: Install and verify Academy search favicons
        uses: skunkworks-academy/www/.github/actions/search-favicons@070f621875577a66ae43cdffa7e9d20c65efdc71
        with:
          artifact-path: "course-site/build"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: course-site/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
